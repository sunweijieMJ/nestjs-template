# CI environment overlay
# For running tests in CI/CD pipelines
#
# Usage:
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.redis.yaml -f docker/docker-compose.postgres.yaml -f docker/docker-compose.ci.yaml up --abort-on-container-exit

services:
  api:
    build:
      target: development
      args:
        ENV_MODE: ci
    environment:
      ENV_MODE: ci
      NODE_ENV: production
      AUTH_JWT_SECRET: ci_jwt_secret_0123456789abcdefghijklmnop
      AUTH_REFRESH_SECRET: ci_refresh_secret_0123456789abcdefghijklmnop
      AUTH_FORGOT_SECRET: ci_forgot_secret_0123456789abcdefghijklmnop
      AUTH_CONFIRM_EMAIL_SECRET: ci_confirm_email_secret_0123456789abcdefghijklmnop
    depends_on:
      maildev:
        condition: service_started
      redis:
        condition: service_healthy
    # No volume mounts in CI - use built-in code
